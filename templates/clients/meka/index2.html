<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/{{client.template}}/css/base.css">
    <link rel="shortcut icon" href="/static/{{client.template}}/img/fav.png" type="image/x-icon">
    <!-- END CSS -->
    <style>
        .logo-wrapper {
            position: fixed;
            top: 30px;
            left: 40px;
            z-index: 1000;
        }

        .logo {
            width: 120px;
            transform-origin: left center;
            transition: filter 0.2s linear;
        }
    </style>
</head>

<body style="background-color: #222; display: flex; justify-content: center; align-items: center; color: #fff; text-align: center;">
    <header class="header">
        <div class="logo-wrapper">
            <img src="/static/meka/img/fav.png" width="150" class="logo" alt="logo"/>
        </div>
    </header>

    <section class="hero"></section>
    <section class="purple-section"></section>
    
    

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> AOS.init({ duration: 2000 }) </script>
    <script src="/static/{{client.template}}/js/main.js"></script>
    <!-- END SCRIPTS -->
    <script>
        const logo = document.querySelector('.logo');

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const maxScroll = 500;

            const progress = Math.min(scrollY / maxScroll, 1);

            const scale = 1 + progress * 3;
            const hue = progress * 90;

            logo.style.transform = `scale(${scale})`;
            logo.style.filter = `hue-rotate(${hue}deg)`;
        });
    </script>
</body>

</html>
